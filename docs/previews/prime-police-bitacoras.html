demoShifts.push({...demoPeople[1],id:'demo-open',started_at:new Date(Date.now()-95*60000).toISOString(),ended_at:null});
async function request(action,{query={}}={}){
 await new Promise(r=>setTimeout(r,30));if(action==='duty-summary')return{summary:demoPeople};
 if(action==='rank-config')return{ranks:[]};
 const from=new Date(query.from).getTime(),to=new Date(query.to).getTime();
 const rows=demoShifts.filter(s=>new Date(s.started_at)<to&&new Date(s.ended_at||Date.now())>=from&&(!query.discord_user_id||s.discord_user_id===query.discord_user_id)&&(!query.unit||s.unit===query.unit)&&(!query.search||(s.full_name+' '+s.plate).toLowerCase().includes(query.search.toLowerCase())));

  const days=[];let date=shiftDayKey(from),last=shiftDayKey(to-1);
  while(date<=last){const matches=rows.filter(s=>shiftDailySeconds(s,date)>0),seconds=matches.reduce((n,s)=>n+shiftDailySeconds(s,date),0);if(matches.length)days.push({date,seconds,shifts:matches.length,open:matches.filter(s=>!s.ended_at).length});date=shiftMoveDay(date,1);}
  return{overview:{total:rows.length,open:rows.filter(s=>!s.ended_at).length,completed:rows.filter(s=>s.ended_at).length,incomplete:rows.filter(s=>s.ended_at&&new Date(s.ended_at)-new Date(s.started_at)<1800000).length,officers:new Set(rows.map(s=>s.discord_user_id)).size,service_seconds:rows.reduce((n,s)=>n+Math.max(0,(Math.min(new Date(s.ended_at||Date.now()),to)-Math.max(new Date(s.started_at),from))/1000),0),days}};
 }

}

let dutyShifts=[],dutyPeople=[],shiftOverviewData=null,shiftTab='open',shiftsLoading=false,shiftOffset=0,shiftNext=null,shiftSearchTimer,shiftReloadRequested=false,shiftLoadSequence=0;

const duration=(start,end)=>shiftHours((new Date(end||Date.now())-new Date(start))/1000);
function shiftDayKey(value){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:SHIFT_ZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));return ['year','month','day'].map(type=>parts.find(p=>p.type===type).value).join('-');}

 const [year,month,date]=day.split('-').map(Number),desired=Date.UTC(year,month-1,date);let stamp=desired;
 for(let i=0;i<3;i++){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:SHIFT_ZONE,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(stamp)).map(p=>[p.type,p.value]));stamp+=desired-Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day),Number(p.hour),Number(p.minute),Number(p.second));}

let shiftCalendarMonth=shiftDayKey(Date.now()).slice(0,7);

function shiftQuery(){
 const from=shiftDayStart($('shiftFrom').value||shiftMoveDay(shiftDayKey(Date.now()),-7)),to=shiftDayStart(shiftMoveDay($('shiftTo').value||shiftDayKey(Date.now()),1));
 if(!Number.isFinite(from.getTime())||!Number.isFinite(to.getTime())||from>=to||to-from>366*86400000)throw Error('Selecciona un período válido de hasta un año.');return{from:from.toISOString(),to:to.toISOString()};

const shiftSearchValue=()=>$('shiftSearch').value.replace(/[^\p{L}\p{N}\s]/gu,'').trim().slice(0,100);

async function loadShifts(){
 if(shiftsLoading){shiftReloadRequested=true;return;}

  const calendar=shiftTab==='calendar',period=calendar?shiftMonthBounds():shiftQuery(),filters={...period,search:calendar?'':shiftSearchValue(),unit:$('shiftUnit').value,...(calendar&&shiftCalendarOfficer?{discord_user_id:shiftCalendarOfficer}:{})};

 }catch(error){if(sequence===shiftLoadSequence&&session===token){$('shiftNotice').textContent=error.message;$('shiftContent').replaceChildren();$('shiftSummary').replaceChildren();}}

function appendShiftPagination(out){const row=document.createElement('div');row.className='shift-pagination';const label=document.createElement('span');label.textContent='Página '+(Math.floor(shiftOffset/50)+1);row.append(label);for(const [text,next,disabled]of [['Anterior',Math.max(0,shiftOffset-50),shiftOffset===0],['Siguiente',shiftNext,shiftNext==null]]){const b=document.createElement('button');b.className='btn';b.type='button';b.textContent=text;b.disabled=disabled;b.addEventListener('click',()=>{shiftOffset=next;loadShifts();});row.append(b);}out.append(row);}
function matchesDuty(p){const q=shiftSearchValue().toLocaleLowerCase('es'),unit=$('shiftUnit').value;return(!unit||p.unit===unit)&&[p.full_name,p.plate,p.discord_user_id].join(' ').toLocaleLowerCase('es').includes(q);}
function renderShiftSummary(){

 $('shiftSummary').innerHTML=[['En servicio',s.open,'Turnos abiertos','live'],['Servicio registrado',shiftHours(s.service_seconds),'Horas dentro del período','hours'],['Turnos completados',s.completed,s.officers+' policías con registros','done'],['Turnos breves',s.incomplete,'Completados de menos de 30 min','short']].map(([title,value,note,tone])=>'<article class="shift-metric shift-metric-'+tone+'"><span>'+safeText(title)+'</span><strong>'+safeText(value)+'</strong><small>'+safeText(note)+'</small></article>').join('');

function renderShiftActivity(out){
  const active=[],inactive=[],absent=[],rankOrder=new Map(rankRoles.map(r=>[r.role_id,Number(r.rank_order)]));
  dutyPeople.filter(matchesDuty).forEach(p=>{const days=p.last_activity?Math.max(0,Math.floor((Date.now()-new Date(p.last_activity))/86400000)):null;const item={p,count:Number(p.shift_count||0),days};(p.on_absence?absent:item.count?active:inactive).push(item);});

  out.innerHTML='<div class="admin-columns"><section class="panel"><h3>Activos en el período · '+active.length+'</h3><p class="muted">Agentes con servicio registrado entre las fechas elegidas.</p><div class="activity-list">'+list(active,false)+'</div></section><section class="panel"><h3>Sin actividad y sin ausencia vigente · '+inactive.length+'</h3><p class="muted">Sin bitácoras en el período. Revisa el expediente antes de tomar medidas.</p><div class="activity-list">'+list(inactive,true)+'</div></section></div>';if(absent.length){const section=document.createElement('section');section.className='panel';section.innerHTML='<h3>Ausencia vigente · '+absent.length+'</h3>'+absent.map(({p})=>'<div class="activity-row absence-row"><div><strong>'+safeText(p.full_name)+'</strong><small>Placa '+safeText(p.plate||'—')+' · '+safeText(unitLabel(p.unit))+'</small></div><span>Hasta '+safeText(p.absence_until)+'</span></div>').join('');out.append(section);}return;}
function shiftDailySeconds(shift,day){const from=shiftDayStart(day).getTime(),to=shiftDayStart(shiftMoveDay(day,1)).getTime();return Math.max(0,(Math.min(new Date(shift.ended_at||Date.now()).getTime(),to)-Math.max(new Date(shift.started_at).getTime(),from))/1000);}
function renderShiftCalendar(out){
 const people=new Map(dutyPeople.filter(matchesDuty).map(p=>[p.discord_user_id,p]));

 const selected=people.get(shiftCalendarOfficer),first=new Date(shiftCalendarMonth+'-01T12:00:00Z'),monthName=first.toLocaleDateString('es-ES',{month:'long',year:'numeric',timeZone:'UTC'}),last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate(),leading=(first.getUTCDay()+6)%7;
 const daily=new Map((shiftOverviewData?.days||[]).map(d=>[d.date,d]));let cells=Array.from({length:leading},()=>'<span class="shift-day-pad" aria-hidden="true"></span>').join('');
 for(let n=1;n<=last;n++){const day=shiftCalendarMonth+'-'+String(n).padStart(2,'0'),data=daily.get(day),seconds=Number(data?.seconds||0),level=seconds>=6*3600?3:seconds>=3*3600?2:seconds>0?1:0,isToday=day===shiftDayKey(Date.now());cells+='<button type="button" class="shift-day level-'+(selected?level:0)+(day===shiftCalendarDay?' selected':'')+(isToday?' today':'')+'" data-shift-day="'+day+'" aria-pressed="'+(day===shiftCalendarDay)+'" aria-label="'+day+(selected&&data?' · '+shiftHours(seconds)+' · '+data.shifts+' turnos':' · Sin registros')+'"'+(!selected?' disabled':'')+'><span>'+n+(isToday?'<i>Hoy</i>':'')+'</span>'+(selected&&data?'<strong>'+shiftHours(seconds)+'</strong><small>'+data.shifts+' turno'+(data.shifts===1?'':'s')+(data.open?' · abierto':'')+'</small>':'<small>—</small>')+'</button>';}
 const detailTitle=shiftCalendarDay?new Date(shiftCalendarDay+'T12:00:00Z').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}):'Detalle del día',detail=daily.get(shiftCalendarDay);
 out.innerHTML='<section class="shift-calendar-shell"><div class="shift-calendar-agent"><div><span class="shift-kicker">AGENDA DE SERVICIO</span><h3>'+safeText(selected?.full_name||'Elige un policía')+'</h3><p>'+safeText(selected?(selected.plate?'Placa '+selected.plate+' · ':'')+(selected.rank_name||'Consulta individual'):'Selecciona un nombre o placa para explorar su actividad.')+'</p></div><label>Policía<select id="shiftCalendarAgent"><option value="">Seleccionar policía…</option>'+[...people.values()].sort((a,b)=>a.full_name.localeCompare(b.full_name,'es')).map(p=>'<option value="'+safeText(p.discord_user_id)+'"'+(p.discord_user_id===shiftCalendarOfficer?' selected':'')+'>'+safeText(p.full_name+' · #'+(p.plate||'—'))+'</option>').join('')+'</select></label></div><div class="shift-calendar-layout"><div><div class="shift-month-heading"><h3>'+safeText(monthName)+'</h3><div><button class="btn" type="button" data-shift-month="-1" aria-label="Mes anterior">←</button><button class="btn" type="button" id="shiftCalendarToday">Este mes</button><button class="btn" type="button" data-shift-month="1" aria-label="Mes siguiente">→</button></div></div><div class="shift-weekdays" aria-hidden="true">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="shift-month-grid">'+cells+'</div><div class="shift-calendar-legend"><span>Horas de servicio</span><span class="level-1">Menos de 3 h</span><span class="level-2">3–6 h</span><span class="level-3">6 h o más</span></div></div><aside class="shift-day-detail" aria-live="polite"><span class="shift-kicker">JORNADA SELECCIONADA</span><h3>'+safeText(detailTitle)+'</h3>'+(selected&&shiftCalendarDay?'<div class="shift-day-total"><strong>'+shiftHours(detail?.seconds||0)+'</strong><span>de servicio en este día</span></div>':'')+'<div id="shiftDayRecords"></div></aside></div></section>';
 const records=$('shiftDayRecords');
 if(!selected){records.innerHTML='<p class="shift-empty">El calendario mostrará los turnos del policía que selecciones.</p>';}

 else{records.innerHTML=dutyShifts.map(s=>'<article class="shift-detail-entry"><div><span class="shift-state '+(s.ended_at?'closed':'open')+'">'+(s.ended_at?'Completado':'En servicio')+'</span><strong>'+shiftHours(shiftDailySeconds(s,shiftCalendarDay))+' en el día</strong></div><dl><dt>Entrada</dt><dd>'+safeText(shiftTime(s.started_at))+'</dd><dt>Salida</dt><dd>'+safeText(shiftTime(s.ended_at))+'</dd><dt>Turno completo</dt><dd>'+duration(s.started_at,s.ended_at)+'</dd></dl>'+(s.close_reason?'<p>'+safeText(s.close_reason)+'</p>':'')+'</article>').join('');appendShiftPagination(records);}
 $('shiftCalendarAgent').addEventListener('change',event=>{shiftCalendarOfficer=event.target.value;shiftCalendarName=people.get(shiftCalendarOfficer)?.full_name||'';shiftOffset=0;loadShifts();});
 out.querySelectorAll('[data-shift-month]').forEach(b=>b.addEventListener('click',()=>{const d=new Date(shiftCalendarMonth+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+Number(b.dataset.shiftMonth));shiftCalendarMonth=d.toISOString().slice(0,7);shiftCalendarDay='';shiftOffset=0;loadShifts();}));

function renderShiftTable(out){
 const rows=dutyShifts.filter(s=>shiftTab==='open'?!s.ended_at:!!s.ended_at),people=new Map(dutyPeople.map(p=>[p.discord_user_id,p]));
 const heading=(title,key)=>'<th scope="col" aria-sort="'+(shiftTableSort===key?(shiftTableDirection==='asc'?'ascending':'descending'):'none')+'"><button type="button" data-shift-sort="'+key+'">'+title+' <span aria-hidden="true">'+(shiftTableSort===key?(shiftTableDirection==='asc'?'↑':'↓'):'↕')+'</span></button></th>';
 out.innerHTML='<section class="shift-register"><div class="shift-register-heading"><div><span class="shift-kicker">'+(shiftTab==='open'?'COORDINACIÓN EN DIRECTO':'ARCHIVO DE SERVICIO')+'</span><h3>'+(shiftTab==='open'?'Personal en servicio':'Historial de turnos')+'</h3></div><span>'+rows.length+' registros en esta página</span></div><div class="table-wrap"><table class="shift-record-table mobile-record-table"><thead><tr>'+heading('Policía','full_name')+'<th scope="col">Rango actual</th>'+heading('Fecha','started_at')+'<th scope="col">Entrada</th><th scope="col">Salida</th><th scope="col">Duración</th><th scope="col">Cierre</th><th scope="col">Gestión</th></tr></thead><tbody>'+rows.map(s=>{const person=people.get(s.discord_user_id),short=s.ended_at&&new Date(s.ended_at)-new Date(s.started_at)<30*60000;return '<tr><td data-label="Policía"><button type="button" class="shift-officer-link" data-shift-agent="'+safeText(s.id)+'"><span class="shift-plate">#'+safeText(s.plate||'—')+'</span><strong>'+safeText(s.full_name)+'</strong></button></td><td data-label="Rango actual">'+safeText(person?.rank_name||'No disponible')+'<small>'+safeText(unitLabel(s.unit))+'</small></td><td data-label="Fecha">'+safeText(new Date(s.started_at).toLocaleDateString('es-ES',{timeZone:SHIFT_ZONE}))+'</td><td data-label="Entrada">'+safeText(new Date(s.started_at).toLocaleTimeString('es-ES',{timeZone:SHIFT_ZONE,hour:'2-digit',minute:'2-digit'}))+'</td><td data-label="Salida">'+(s.ended_at?safeText(new Date(s.ended_at).toLocaleTimeString('es-ES',{timeZone:SHIFT_ZONE,hour:'2-digit',minute:'2-digit'}))+(shiftDayKey(s.started_at)!==shiftDayKey(s.ended_at)?'<small>'+safeText(shiftDayKey(s.ended_at))+'</small>':''):'<span class="shift-state open">En servicio</span>')+'</td><td data-label="Duración"><span class="shift-duration '+(short?'brief':'')+'">'+duration(s.started_at,s.ended_at)+'</span>'+(short?'<small>Menos de 30 min</small>':!s.ended_at&&Date.now()-new Date(s.started_at)>12*3600000?'<small class="shift-warning">Más de 12 h abierto</small>':'')+'</td><td data-label="Cierre">'+safeText(s.closed_by?'Administrativo':s.ended_at?'Salida registrada':'Pendiente de salida')+'<small>'+safeText(s.close_reason||'')+'</small></td><td data-label="Gestión"><div class="shift-row-actions">'+(!s.ended_at?'<button type="button" class="btn shift-close-btn" data-close-shift="'+safeText(s.id)+'">Cerrar turno</button>':'')+'<button type="button" class="btn reject" data-delete-shift="'+safeText(s.id)+'">Eliminar</button></div></td></tr>';}).join('')+(!rows.length?'<tr><td colspan="8" class="shift-empty">No hay bitácoras que coincidan con estos filtros.</td></tr>':'')+'</tbody></table></div></section>';
 appendShiftPagination(out);
 out.querySelectorAll('[data-shift-sort]').forEach(b=>b.addEventListener('click',()=>{shiftTableDirection=shiftTableSort===b.dataset.shiftSort&&shiftTableDirection==='desc'?'asc':'desc';shiftTableSort=b.dataset.shiftSort;shiftOffset=0;loadShifts();}));
 out.querySelectorAll('[data-shift-agent]').forEach(b=>b.addEventListener('click',()=>{const s=dutyShifts.find(s=>s.id===b.dataset.shiftAgent);shiftCalendarOfficer=s.discord_user_id;shiftCalendarName=s.full_name;shiftCalendarMonth=shiftDayKey(s.started_at).slice(0,7);shiftCalendarDay=shiftDayKey(s.started_at);shiftTab='calendar';shiftOffset=0;loadShifts();}));
 for(const [attribute,mode]of [['closeShift','close'],['deleteShift','delete']])out.querySelectorAll('[data-'+(mode==='close'?'close':'delete')+'-shift]').forEach(b=>b.addEventListener('click',()=>{const item=dutyShifts.find(s=>s.id===b.dataset[attribute]);if(item)openShiftAdmin(item,mode);}));
}
function renderShifts(){try{
 document.querySelectorAll('[data-shift-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.shiftTab===shiftTab);b.setAttribute('aria-selected',String(b.dataset.shiftTab===shiftTab));});
 $('shiftPeriodFields').hidden=shiftTab==='calendar';$('shiftSortField').hidden=shiftTab!=='activity';renderShiftSummary();
 const out=$('shiftContent');if(shiftTab==='activity')renderShiftActivity(out);else if(shiftTab==='calendar')renderShiftCalendar(out);else renderShiftTable(out);
 }catch(error){$('shiftContent').textContent=error.message;}}
$('refreshShifts').addEventListener('click',loadShifts);
document.querySelectorAll('[data-shift-tab]').forEach(b=>b.addEventListener('click',()=>{shiftTab=b.dataset.shiftTab;shiftOffset=0;loadShifts();}));
['shiftFrom','shiftTo','shiftUnit'].forEach(id=>$(id).addEventListener('change',()=>{shiftOffset=0;loadShifts();}));$('shiftSort').addEventListener('change',renderShifts);
$('shiftSearch').addEventListener('input',()=>{clearTimeout(shiftSearchTimer);shiftSearchTimer=setTimeout(()=>{shiftOffset=0;loadShifts();},300);});
$('shiftFrom').value=shiftMoveDay(shiftDayKey(Date.now()),-7);$('shiftTo').value=shiftDayKey(Date.now());
window.addEventListener('panel-session-ended',()=>{shiftLoadSequence++;shiftsLoading=false;shiftReloadRequested=false;dutyShifts=[];dutyPeople=[];shiftOverviewData=null;shiftCalendarOfficer='';shiftCalendarName='';shiftCalendarDay='';clearTimeout(shiftSearchTimer);$('shiftSummary').replaceChildren();$('shiftContent').replaceChildren();$('shiftContent').removeAttribute('aria-busy');});

shiftTab='history';$('shiftFrom').value='2026-11-01';$('shiftTo').value='2026-11-07';loadShifts();</script></body></html>
