name: Deploy PRIME POLICE panel to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check client scripts
        run: |
          node --check app.js
          node --check nie-ui.js
          node --check bonuses-ui.js
          node --check application-review-ui.js
          node --check personnel-profile.js
          node --check auto-plates.js
          node --check shifts.js
          node --check shifts-actions.js
          node --check pending-changes.js
          node --check intake-editor.js
          node --check preselection-ingress.js
          node --check records-ui.js
          node --check evidence-ui.js
          node --check h50-ui.js
          node --check app-shell.js
          node --check absence-ui.js
          node --check dashboard.js
          node --check administration.js
          node --check departures.js
          node --check clean-workspace.js
          node --check personnel-register.js
          node --check promotions-workspace.js
          node --check recruitment-veto-ui.js
      - name: Check Edge Function types and variable scope
        run: npx --yes --package typescript@5.9.3 tsc --noEmit --skipLibCheck --allowImportingTsExtensions --moduleResolution bundler --module esnext --target es2022 --lib es2022,dom,dom.iterable scripts/edge-runtime.d.ts supabase/functions/prime-police-panel/index.ts supabase/functions/prime-police-discord/index.ts supabase/functions/prime-police-notifications/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build public assets only
        run: |
          npm ci --ignore-scripts
          node scripts/check-application-identity.mjs
          node scripts/check-session-persistence.mjs
          node scripts/check-private-error-notices.mjs
          node scripts/check-shift-workspace.mjs
          node --experimental-strip-types scripts/check-shift-overview.mjs
          node scripts/check-shift-overview-sql.mjs
          node --experimental-strip-types scripts/check-panel-origins.mjs
          node --experimental-strip-types scripts/check-rejection-roles.mjs
          node --experimental-strip-types scripts/check-application-tools.mjs
          node --experimental-strip-types scripts/check-manual-application-review.mjs
          node --experimental-strip-types scripts/check-automatic-review-alerts.mjs
          node --experimental-strip-types scripts/check-rejection-history.mjs
          node --experimental-strip-types scripts/check-personnel-membership.mjs
          node --experimental-strip-types scripts/check-real-ranks.mjs
          node --experimental-strip-types scripts/check-division-leadership.mjs
          node --experimental-strip-types scripts/check-nie.mjs
          node scripts/check-nie-sql.mjs
          node --experimental-strip-types scripts/check-bonuses.mjs
          node scripts/check-bonuses-sql.mjs
          node --experimental-strip-types scripts/check-promotion-announcements.mjs
          node --experimental-strip-types scripts/check-application-permissions.mjs
          node --experimental-strip-types scripts/check-personnel-status.mjs
          node --experimental-strip-types scripts/check-general-departure-role.mjs
          node --experimental-strip-types scripts/check-personnel-career.mjs
          node --experimental-strip-types scripts/check-personnel-register.mjs
          node --experimental-strip-types scripts/check-profile-loading.mjs
          node --experimental-strip-types scripts/check-personnel-avatar.mjs
          node scripts/check-promotion-workspace.mjs
          node --experimental-strip-types scripts/check-recruitment-veto.mjs
          node --experimental-strip-types scripts/check-admission-fields.mjs
          node --experimental-strip-types scripts/check-administrative-workspace.mjs
          node --experimental-strip-types scripts/check-administration.mjs
          node --experimental-strip-types scripts/check-weekly-reports.mjs
          node --experimental-strip-types scripts/check-shift-reminders.mjs
          node --experimental-strip-types scripts/check-transfer-questionnaire.mjs
          node --experimental-strip-types scripts/check-external-ai-review.mjs
          node --experimental-strip-types scripts/check-evidence-records.mjs
          node scripts/check-sanction-notice-privacy.mjs
          node scripts/check-evidence-disabled.mjs
          node --experimental-strip-types scripts/check-h50.mjs
          node scripts/check-h50-sql.mjs
          node --experimental-strip-types scripts/check-h50-status.mjs
          node --experimental-strip-types scripts/check-evidence-form.mjs
          node --experimental-strip-types scripts/check-evidence-channel-move.mjs
          node scripts/check-evidence-participants-ui.mjs
          node --experimental-strip-types scripts/check-evidence-police-picker.mjs
          node --experimental-strip-types scripts/check-discord-member-reader.mjs
          node --experimental-strip-types scripts/check-evidence-modal-response.mjs
          npm run build
          node scripts/check-public-build.mjs
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
